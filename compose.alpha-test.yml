services:
  urbanflow-alpha-test:
    image: urbanflow-alpha-test:${URBANFLOW_COMMIT_SHA:?Set URBANFLOW_COMMIT_SHA to the tested commit}
    build:
      context: .
      args:
        URBANFLOW_COMMIT_SHA: ${URBANFLOW_COMMIT_SHA:?Set URBANFLOW_COMMIT_SHA to the tested commit}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      URBANFLOW_COMMIT_SHA: ${URBANFLOW_COMMIT_SHA:?Set URBANFLOW_COMMIT_SHA to the tested commit}
      URBANFLOW_ALPHA_TEST: "1"
    ports:
      - "127.0.0.1:3101:3000"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - alpha-private

networks:
  alpha-private:
    internal: true
