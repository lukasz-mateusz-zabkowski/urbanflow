name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Audit all dependencies, including development tools
        run: npm run audit:all

  container-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and run the release image
        shell: bash
        run: |
          set -euo pipefail
          image=urbanflow-health-test:${GITHUB_SHA}
          container=urbanflow-health-test
          expected_version=$(node -p "require('./package.json').version")
          docker build --build-arg URBANFLOW_COMMIT_SHA="$GITHUB_SHA" -t "$image" .
          docker run -d --name "$container" -p 127.0.0.1:3000:3000 "$image"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health -o /tmp/urbanflow-health.json; then
              break
            fi
            sleep 1
          done
          EXPECTED_VERSION="$expected_version" EXPECTED_COMMIT="$GITHUB_SHA" node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("/tmp/urbanflow-health.json", "utf8"));
            if (health.status !== "ok" || health.version !== process.env.EXPECTED_VERSION || health.commit !== process.env.EXPECTED_COMMIT) {
              throw new Error(`Unexpected container health payload: ${JSON.stringify(health)}`);
            }
          '
          curl --fail --silent http://127.0.0.1:3000/ -o /dev/null
          curl --fail --silent http://127.0.0.1:3000/vendor/leaflet/leaflet.js -o /dev/null
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          for attempt in $(seq 1 45); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$state" = healthy ]; then exit 0; fi
            sleep 2
          done
          echo "Container healthcheck state: $state" >&2
          exit 1
      - name: Run isolated alpha Compose profile
        env:
          URBANFLOW_COMMIT_SHA: ${{ github.sha }}
          COMPOSE_PROJECT_NAME: urbanflow-alpha-test-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -p "$COMPOSE_PROJECT_NAME" -f compose.alpha-test.yml)
          cleanup() { "${compose[@]}" down --remove-orphans || true; }
          trap cleanup EXIT
          "${compose[@]}" up --build --detach
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3101/health -o /tmp/urbanflow-alpha-test-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          EXPECTED_VERSION="$(node -p "require('./package.json').version")" EXPECTED_COMMIT="$GITHUB_SHA" node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("/tmp/urbanflow-alpha-test-health.json", "utf8"));
            if (health.status !== "ok" || health.version !== process.env.EXPECTED_VERSION || health.commit !== process.env.EXPECTED_COMMIT) {
              throw new Error(`Unexpected alpha-test health payload: ${JSON.stringify(health)}`);
            }
          '
          test "$("${compose[@]}" port urbanflow-alpha-test 3000)" = "127.0.0.1:3101"
          container=$("${compose[@]}" ps -q urbanflow-alpha-test)
          test -n "$container"
          test "$(docker inspect --format '{{len .Mounts}}' "$container")" = 0
          curl --fail --silent http://127.0.0.1:3101/ -o /dev/null
          curl --fail --silent http://127.0.0.1:3101/vendor/leaflet/leaflet.js -o /dev/null
          "${compose[@]}" stop urbanflow-alpha-test
          test "$(docker inspect --format '{{.State.Status}}' "$container")" = exited
